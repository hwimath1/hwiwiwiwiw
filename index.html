<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>복소수의 사칙연산의 응용</title>
  <!-- MathJax -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0; padding: 0;
      background: #f0f0f0;
      color: #333;
    }
    header, .content, .footer {
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 20px 0;
    }
    #nameInputContainer {
      text-align: center;
      margin: 20px 0;
    }
    .difficulty-container {
      text-align: center;
      margin: 20px 0;
    }
    .difficulty-button {
      background: #008cff;
      color: #fff;
      padding: 10px 20px;
      margin: 5px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 5px;
    }
    .game-container {
      display: none;
      text-align: center;
      margin-top: 30px;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
    }
    .question-text {
      font-weight: bold;
      margin: 10px 0 20px;
      min-height: 60px;
    }
    .choices-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    .choice-button {
      background: #f7f7f7;
      border: 2px solid #ccc;
      border-radius: 5px;
      color: #333;
      font-size: 1rem;
      margin: 5px 0;
      padding: 8px 15px;
      cursor: pointer;
      width: 60%;
      max-width: 300px;
      text-align: center;
    }
    .choice-button:hover {
      background: #e9e9e9;
    }
    #scoreDisplay, #timeDisplay, #livesDisplay {
      font-weight: bold;
      margin: 10px;
    }
    #gameEndMessage {
      font-weight: bold;
      font-size: 1.2rem;
      margin: 20px 0;
    }
    #energyBarContainer {
      position: relative;
      width: 300px;
      height: 20px;
      background: #ccc;
      margin: 10px auto 20px;
      border-radius: 10px;
      overflow: hidden;
    }
    #energyBar {
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      height: 100%;
      background: #00cf00;
      transition: width 0.2s linear;
    }
    #sendScoreBtn {
      background: #008cff;
      color: #fff;
      padding: 10px 20px;
      margin: 10px 0;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 5px;
    }
    #response {
      margin-top: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<header>
  <h1>복소수의 사칙연산의 응용</h1>
</header>

<div class="content">
  <div id="nameInputContainer">
    <label for="userName">이름을 입력하세요:</label><br/>
    <input type="text" id="userName" style="margin-top:10px;"/>
  </div>

  <div class="difficulty-container">
    <p>난이도를 선택하세요.</p>
    <button class="difficulty-button" onclick="startGame('최상')">최상 (시작시간 약 25초, 문제당 20점)</button>
    <button class="difficulty-button" onclick="startGame('상')">상 (시작시간 약 35초, 문제당 15점)</button>
    <button class="difficulty-button" onclick="startGame('중')">중 (시작시간 약 45초, 문제당 13점)</button>
    <button class="difficulty-button" onclick="startGame('하')">하 (시간제한 없음, 문제당 10점)</button>
  </div>

  <div class="game-container" id="gameContainer">
    <div id="timeDisplay"></div>
    <div id="scoreDisplay"></div>
    <div id="livesDisplay"></div>
    <div id="energyBarContainer">
      <div id="energyBar"></div>
    </div>

    <div class="question-text" id="questionText"></div>
    <div class="choices-container" id="choicesContainer"></div>
    <div id="gameEndMessage"></div>

    <button id="sendScoreBtn" onclick="sendScore()" style="display:none;">점수 전송</button>
    <div id="response"></div>
  </div>
</div>

<div class="footer"></div>

<script>
  /********************************************
   * 여기서는 <=, >= 등이 필요한 문제가 없으므로 생략합니다.
   ********************************************/

  // -- 전송 함수 --
  async function saveData(game, name, score, elapsedTime) {
      const FUNCTION_URL = "https://us-central1-record-f420d.cloudfunctions.net/report";

      const requestData = {
          game,
          name,
          score: parseInt(score, 10),
          elapsedTime: parseInt(elapsedTime, 10)
      };

      try {
          const response = await fetch(FUNCTION_URL, {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json'
              },
              body: JSON.stringify(requestData)
          });
          const responseData = await response.json();

          if (response.ok) {
              document.getElementById('response').innerText =
                  `성공: ${JSON.stringify(responseData, null, 2)}`;
          } else {
              document.getElementById('response').innerText =
                  `오류: ${JSON.stringify(responseData, null, 2)}`;
          }
      } catch (error) {
          console.error('요청 실패:', error);
          document.getElementById('response').innerText =
              `네트워크 오류: ${error.message}`;
      }
  }

  // 난이도별 정보
  const difficultyInfo = {
    "최상": { timeStart: 25, scorePerQuestion: 20 },
    "상": { timeStart: 35, scorePerQuestion: 15 },
    "중": { timeStart: 45, scorePerQuestion: 13 },

    {
      question: "다음을 계산하여라. \\(\\Bigl(\\frac{1 + i}{1 - i}\\Bigr)^{2016}\\)",
      choices: ["-i", "i", "-1", "1"],
      correctIndex: 0
    },
    {
      question: "다음을 계산하여라. \\(\\frac{1 - i}{1 + i}\\)",
      choices: ["-i", "i", "1", "-1"],
      correctIndex: 0
    },
    {
      question: "다음을 계산하여라. \\(\\Bigl(\\frac{1 - i}{1 + i}\\Bigr)^{2}\\)",
      choices: ["-i", "i - 1", "-1", "1"],
      correctIndex: 2
    },
    {
      question: "다음을 계산하여라. \\(\\Bigl(\\frac{1 - i}{1 + i}\\Bigr)^{10}\\)",
      choices: ["-1", "1", "0", "-i"],
      correctIndex: 0
    },
    {
      question: "다음을 계산하여라. \\(\\Bigl(\\frac{1 - i}{1 + i}\\Bigr)^{106}\\)",
      choices: ["-1", "1", "i", "-i"],
      correctIndex: 0
    },
    {
      question: "다음을 계산하여라. \\(\\Bigl(\\frac{1 - i}{1 + i}\\Bigr)^{2014}\\)",
      choices: ["-1", "i", "0", "1"],
      correctIndex: 0
    },
    {
      question: "다음을 계산하여라. \\(\\Bigl(\\frac{1 + i}{1 - i}\\Bigr)^{25} + \\Bigl(\\frac{1 - i}{1 + i}\\Bigr)^{30}\\)",
      choices: ["0", "i - 1", "-i - 1", "2i - 1"],
      correctIndex: 1
    },
    {
      question: "다음을 계산하여라. \\(\\Bigl(\\frac{1 + i}{1 - i}\\Bigr)^{40} - \\Bigl(\\frac{1 - i}{1 + i}\\Bigr)^{51}\\)",
      choices: ["-i", "i - 1", "0", "-1"],
      correctIndex: 1
    }
  ];

  // -- Shuffle the entire problem set so that they come out in random order. --
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  let shuffledQuestions = [...allQuestions];
  shuffleArray(shuffledQuestions);

  // Game variables
  let currentQuestionIndex = 0;
  let score = 0;
  let lives = 3;
  let totalElapsedTime = 0; // 전체 게임 시간
  let timeLeft = 0;         // 현재 문제 타이머
  let timerInterval = null;
  let energyWidth = 100;    // 에너지바는 100%에서 시작

  let difficulty = "하";
  let scorePerQuestion = 10;

  function startGame(selectedDiff) {
    const nameValue = document.getElementById('userName').value.trim();
    if (!nameValue) {
      alert("이름을 입력해주세요!");
      return;
    }
    difficulty = selectedDiff;
    scorePerQuestion = difficultyInfo[difficulty].scorePerQuestion;
    timeLeft = difficultyInfo[difficulty].timeStart;

    document.querySelector('.difficulty-container').style.display = 'none';
    document.getElementById('nameInputContainer').style.display = 'none';
    document.getElementById('gameContainer').style.display = 'block';

    updateScoreDisplay();
    updateLivesDisplay();
    updateTimeDisplay();
    displayQuestion();
    startTimer();
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);

    energyWidth = 100;
    updateEnergyBar();

    timerInterval = setInterval(() => {
      if (difficulty !== "하") {
        timeLeft -= 1;
        if (timeLeft <= 0) {
          // 시간 초과 -> 기회 1감소
          lives--;
          updateLivesDisplay();
          if (lives === 0) {
            endGame("시간 초과로 기회가 소진되었습니다. 게임 종료!");
            return;
          }
          // 새 문제로 넘어가기
          nextQuestion();
        } else {
          // 비례해서 에너지바 줄이기
          const ratio = timeLeft / difficultyInfo[difficulty].timeStart;
          energyWidth = ratio * 100;
        }
        updateEnergyBar();
        updateTimeDisplay();
        totalElapsedTime++;
      } else {
        // 하 난이도는 시간제한 없음
        totalElapsedTime++;
      }
    }, 1000);
  }

  function updateEnergyBar() {
    const bar = document.getElementById('energyBar');
    bar.style.width = energyWidth + "%";
    if (energyWidth < 30) {
      bar.style.background = "#ff4b4b";
    } else if (energyWidth < 60) {
      bar.style.background = "#ffc100";
    } else {
      bar.style.background = "#00cf00";
    }
  }

  function updateScoreDisplay() {
    document.getElementById('scoreDisplay').textContent = "점수: " + score;
  }

  function updateTimeDisplay() {
    let timeText = (difficulty === "하") 
      ? "시간 제한 없음 (총 소요시간: " + totalElapsedTime + "초)"
      : "남은 시간: 약 " + timeLeft + "초 (총 소요시간: " + totalElapsedTime + "초)";
    document.getElementById('timeDisplay').textContent = timeText;
  }

  function updateLivesDisplay() {
    document.getElementById('livesDisplay').textContent = "남은 기회: " + lives;
  }

  function displayQuestion() {
    if (currentQuestionIndex >= shuffledQuestions.length) {
      endGame("모든 문제를 풀었습니다! 축하합니다!");
      return;
    }
    const q = shuffledQuestions[currentQuestionIndex];

    const questionEl = document.getElementById('questionText');
    const choicesEl = document.getElementById('choicesContainer');

    questionEl.innerHTML = q.question;
    choicesEl.innerHTML = "";

    for (let i = 0; i < q.choices.length; i++) {
      const btn = document.createElement('button');
      btn.className = "choice-button";
      btn.innerHTML = q.choices[i];
      btn.onclick = () => checkAnswer(i);
      choicesEl.appendChild(btn);
    }

    // MathJax 렌더링
    MathJax.typeset();
  }

  function checkAnswer(chosenIndex) {
    const q = shuffledQuestions[currentQuestionIndex];
    if (chosenIndex === q.correctIndex) {
      score += scorePerQuestion;
      updateScoreDisplay();
    } else {
      alert("틀렸습니다! 정답: " + q.choices[q.correctIndex]);
      lives--;
      updateLivesDisplay();
      if (lives === 0) {
        endGame("기회를 모두 소진했습니다. 게임 종료!");
        return;
      }
    }
    nextQuestion();
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex >= shuffledQuestions.length) {
      endGame("모든 문제를 풀었습니다! 축하합니다!");
    } else {
      timeLeft = difficultyInfo[difficulty].timeStart;
      startTimer();
      displayQuestion();
    }
  }

  function endGame(msg) {
    clearInterval(timerInterval);
    document.getElementById('gameEndMessage').innerHTML = msg;
    document.getElementById('sendScoreBtn').style.display = 'inline-block';
  }

  function sendScore() {
    const nameValue = document.getElementById('userName').value.trim();
    saveData("복소수의 사칙연산의 응용", nameValue, score, totalElapsedTime);
  }
</script>
</body>
</html>
